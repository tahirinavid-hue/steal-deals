name: Module A — Snowblower (Every 2 Days)

on:
  schedule:
    # 8:00 PM UTC every other day (days 1,3,5,...,31 of each month)
    - cron: "0 20 */2 * *"
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check expiry (kill after 2026-09-29)
        run: |
          EXPIRY="2026-09-29"
          TODAY=$(date -u +%Y-%m-%d)
          if [[ "$TODAY" > "$EXPIRY" ]]; then
            echo "Agent expired on $EXPIRY. Skipping run."
            exit 0
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run snowblower module
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL || 'onboarding@resend.dev' }}
          # Optional overrides:
          SNOWBLOWER_THRESHOLD: ${{ vars.SNOWBLOWER_THRESHOLD || '1600' }}
          SNOWBLOWER_MSRP: ${{ vars.SNOWBLOWER_MSRP || '1999' }}
          SNOWBLOWER_STEAL_PCT: ${{ vars.SNOWBLOWER_STEAL_PCT || '20' }}
        run: python modules/run_snowblower.py
